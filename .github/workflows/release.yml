name: Release

# Push a tag like v0.2.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/Duckr.Tests/Duckr.Tests.csproj -c Release

      - name: Publish (self-contained)
        run: dotnet publish src/Duckr/Duckr.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish

      - name: Pack installer
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} --outputDir releases
          vpk pack --packId Duckr --packVersion ${{ env.VERSION }} --packDir publish --mainExe Duckr.exe --packTitle Duckr --icon src/Duckr/Assets/duckr.ico --splashImage installer/splash.gif --outputDir releases

      # Uploads Setup.exe plus the update files (nupkg + releases.win.json)
      # that the in-app updater reads.
      - name: Publish GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} --publish --releaseName "Duckr ${{ env.VERSION }}" --tag ${{ github.ref_name }} --outputDir releases
