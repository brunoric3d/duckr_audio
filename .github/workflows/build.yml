name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Duckr.sln -c Release
      - name: Test
        run: dotnet test tests/Duckr.Tests/Duckr.Tests.csproj -c Release --no-build
